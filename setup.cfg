[nosetests]
verbosity = 2
detailed-errors = 1
with-spec = 1
spec-color = 1
with-coverage = 1
cover-package = app

[coverage:run]
data_file = .coverage
omit = 
    tests/*
    setup.py

[flake8]
ignore = W503, E203
max-line-length = 120
exclude = .git,__pycache__,build,dist

[pylint.messages_control]
disable = 
    C0330,
    C0326
